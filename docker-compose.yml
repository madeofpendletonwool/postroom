services:
  postroom:
    build: .
    container_name: postroom
    ports:
      - "8089:8080"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      - POSTROOM_USER=admin
      - POSTROOM_PASS=postroom
    volumes:
      - postroom_data:/data
    restart: unless-stopped

volumes:
  postroom_data:
